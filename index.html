<style>

td .d{display:block;font-size:11px;color:var(--txt2)}td.nw{white-space:nowrap}

.sheet .inner{background:var(--bg1);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;text-align:left}
.sheet h3{margin:0;font-size:17px;text-align:center}
.sheet .sec-t{font-size:11.5px;color:var(--txt2);text-transform:uppercase;letter-spacing:1px;margin-top:6px}

.sheet .r input,.sheet .r select{flex:1;text-align:right;background:transparent;border:0;padding:0;max-width:60%}

.ok{color:var(--grund);font-weight:700;font-size:13px}.warn{color:var(--zuschlag);font-size:13px}

.imp-eintrag .k{display:flex;gap:10px;align-items:flex-start}.imp-eintrag input[type=checkbox]{width:22px;height:22px;flex:0 0 22px;margin-top:2px}
.vorschau{max-width:100%;max-height:220px;border-radius:10px}

</style>

<body>
<button class="zahnrad" id="zahnrad" aria-label="Einstellungen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button>
<main id="view"></main>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script>
'use strict';
// ============================================================ Grundlagen
const LS = 'zeiterfassung.v1';
const pad = n => String(n).padStart(2, '0');
const at = (d, hhmm) => { const [h, m] = String(hhmm).split(':').map(Number); const x = new Date(d); x.setHours(h || 0, m || 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addMin = (d, n) => new Date(d.getTime() + n * 60000);
const sod = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const wd = d => d.getDay() + 1;                    // 1 = So … 7 = Sa (wie Swift)
const istWerktag = d => d.getDay() >= 1 && d.getDay() <= 5;
const monatStart = d => new Date(d.getFullYear(), d.getMonth(), 1);
const addMonths = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
const toInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const toDateInput = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const WD = ['So.', 'Mo.', 'Di.', 'Mi.', 'Do.', 'Fr.', 'Sa.'];
const MON = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
const MONK = ['Jan', 'Feb', 'Mär', 'Apr', 'Mai', 'Jun', 'Jul', 'Aug', 'Sep', 'Okt', 'Nov', 'Dez'];
const Fmt = {
  zeit: d => `${pad(d.getHours())}:${pad(d.getMinutes())}`,
  datum: d => `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`,
  kurz: d => `${WD[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth() + 1)}. · ${Fmt.zeit(d)}`,
  tag: d => `${WD[d.getDay()]} ${pad(d.getDate())}.${pad(d.getMonth() + 1)}.`,
  monat: d => `${MON[d.getMonth()]} ${d.getFullYear()}`,
  euro: v => (Math.round(v * 100) / 100).toLocaleString('de-DE', { style: 'currency', currency: 'EUR' }),
  dauer: min => { const m = Math.round(Math.max(0, min)), h = Math.floor(m / 60), r = m % 60; return h > 0 && r > 0 ? `${h} h ${r} min` : h > 0 ? `${h} h` : `${r} min`; },
};
const TYP = { technisch: 'Technisch (daheim)', vorort: 'Vor Ort' };

// ============================================================ Daten (lokal im Browser)
function defaultSettings() {
  return { entgeltgruppe: 'Ä3', stufe: 1, dienstbeginn: '08:00', dienstende: '16:30', refRuheStunden: 11, name: '', mail: '', empfaenger: '',
    bundesland: 'NW', ohneFreizeitausgleich: true, darstellung: 'dunkel', ortLat: null, ortLon: null, ortRadius: 400, ortName: 'Arbeitsstätte', ortAktiv: false };
}
let DB = { einsaetze: [], tage: [], s: defaultSettings(), meta: { letztesBackup: null, geaendert: 0 } };
function load() {
  try { const j = JSON.parse(localStorage.getItem(LS) || 'null'); if (j) { DB = j; DB.s = Object.assign(defaultSettings(), j.s || {}); DB.meta = Object.assign({ letztesBackup: null, geaendert: 0 }, j.meta || {}); } } catch (e) {}
}
function save(stumm) { if (!stumm) { DB.meta.geaendert = (DB.meta.geaendert || 0) + 1; if (!DB.meta.ersteAenderung) DB.meta.ersteAenderung = new Date().toISOString(); } try { localStorage.setItem(LS, JSON.stringify(DB)); } catch (e) { alert('Speichern fehlgeschlagen: ' + e); } }
// Einsatz: {id, beginn, ende (ISO), typ, quelle, aktiv, laeuft, hinweis}
const B = e => new Date(e.beginn), E = e => new Date(e.ende);
const EW = e => e.laeuft ? new Date(Math.max(Date.now(), B(e).getTime() + 3 * 60000)) : E(e);
const dauerMin = e => Math.max(0, (EW(e) - B(e)) / 60000);
const aktive = () => DB.einsaetze.filter(e => e.aktiv !== false);
const S = () => DB.s;

// ============================================================ Feiertage (Gauß)
const Feiertage = {
  ostern(j) { const a = j % 19, b = Math.floor(j / 100), c = j % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3),
    h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const mo = Math.floor((h + l - 7 * m + 114) / 31), ta = ((h + l - 7 * m + 114) % 31) + 1; return new Date(j, mo - 1, ta); },
  cache: {},
  liste(j, bl) {
    const key = j + bl; if (this.cache[key]) return this.cache[key];
    const fix = (m, d) => new Date(j, m - 1, d), o = this.ostern(j);
    const t = [fix(1, 1), addDays(o, -2), addDays(o, 1), fix(5, 1), addDays(o, 39), addDays(o, 50), fix(10, 3), fix(12, 25), fix(12, 26)];
    if (['NW', 'BW', 'BY', 'HE', 'RP', 'SL'].includes(bl)) { t.push(addDays(o, 60)); t.push(fix(11, 1)); }
    if (['BB', 'MV', 'SN', 'ST', 'TH', 'HH', 'HB', 'NI', 'SH', 'BE'].includes(bl)) t.push(fix(10, 31));
    if (bl === 'BY') { t.push(fix(1, 6)); t.push(fix(8, 15)); }
    if (bl === 'SN') { let d = new Date(j, 10, 22); while (d.getDay() !== 3) d = addDays(d, -1); t.push(d); }
    return this.cache[key] = new Set(t.map(x => sod(x).getTime()));
  },
  ist(d, bl) { return this.liste(d.getFullYear(), bl).has(sod(d).getTime()); },
};

// ============================================================ Tarif (TV-Ärzte/TdL, 40 h)
const Entgelttabelle = {
  divisor: 40 * 4.348,
  gruppen: ['Ä1', 'Ä2', 'Ä3', 'Ä4'],

}

    <div class="sec-t">Ruhezeit</div><div class="seg"><button class="${s.refRuheStunden === 10 ? 'on' : ''}" onclick="set('refRuheStunden',10)">10 Stunden</button><button class="${s.refRuheStunden === 11 ? 'on' : ''}" onclick="set('refRuheStunden',11)">11 Stunden</button></div>
    ${r('Regulärer Dienstbeginn', `<input type="time" value="${s.dienstbeginn}" onchange="set('dienstbeginn',this.value)">`)}${r('Regelarbeitszeit-Ende (Mo–Fr)', `<input type="time" value="${s.dienstende}" onchange="set('dienstende',this.value)">`)}
    <div class="sec-t">Standort (dezent)</div>
    ${r('Bei Vor-Ort-Einsätzen vermerken', `<input type="checkbox" ${s.ortAktiv ? 'checked' : ''} onchange="set('ortAktiv',this.checked)">`)}
    ${r('Name der Arbeitsstätte', tx('ortName', 'z. B. Uniklinik'))}
    ${r('Umkreis', `<select onchange="set('ortRadius',+this.value)">${[200, 400, 800, 1500].map(v => `<option value="${v}" ${s.ortRadius == v ? 'selected' : ''}>${v} m</option>`).join('')}</select>`)}
    <button class="btn rand" onclick="Geo.arbeitsstaetteSetzen()">${ico('pin')}${s.ortLat != null ? 'Arbeitsstätte neu festlegen (aktuell ' + s.ortLat + ', ' + s.ortLon + ')' : 'Arbeitsstätte: hier festlegen (am Arbeitsplatz antippen)'}</button>
    <div class="hint">Während ein Vor-Ort-Einsatz läuft und die App offen ist, wird etwa alle 10 Minuten sowie bei Start/Ende der Standort gemessen und nur die Entfernung zur Arbeitsstätte vermerkt. Im Protokoll erscheint dann dezent „bestätigt 17:42–19:10". Keine Hintergrund-Ortung, nichts verlässt das Telefon.</div>
    <div class="sec-t">Meldungen</div>${r('Mein Name', tx('name', 'Name'))}${r('Meine E-Mail', tx('mail', 'für Protokoll an mich', 'email'))}${r('Verteiler', tx('empfaenger', 'Mailadressen, mit Komma', 'email'))}
    <div class="sec-t">Backup</div><div class="hint">${DB.meta && DB.meta.letztesBackup ? "Letztes Backup: " + Fmt.kurz(new Date(DB.meta.letztesBackup)) : "Noch kein Backup erstellt"}</div><button class="btn rand" onclick="backupExport()">${ico('up')}Backup erstellen &amp; teilen (${DB.einsaetze.length} Einsätze, ${DB.tage.length} Tage)</button>
    <label class="btn rand" style="display:block;text-align:center">${ico('down')}Backup wiederherstellen (Datei wählen)<input type="file" accept=".json,application/json" hidden onchange="backupImport(this)"></label>
    <div class="hint"><b>Aus einer Backup-Mail zurückholen:</b> In der Mail den Anhang „Zeiterfassung-Backup-….json" antippen → Teilen-Symbol → „In Dateien sichern". Dann hier „Backup wiederherstellen" → Dateien → die gesicherte Datei wählen. Vorhandene Einträge bleiben erhalten; Dubletten werden übersprungen, Überschneidungen zusammengeführt. Auf einem neuen oder leeren Telefon ist damit alles wieder da – inklusive Einstellungen, wenn du das bestätigst.</div>
    <div class="hint">Alle Daten bleiben lokal auf diesem Gerät. Entgelttabellen TdL 40 h (Marburger Bund, Tarifrunde 2026) – je Dienstdatum automatisch die gültige Tabelle.</div>
    <button class="btn" onclick="sheet(false)">Fertig</button>`;
}
async function backupExport() {
  const d = { app: 'Zeiterfassung', version: 1, exportiert: new Date().toISOString(), einsaetze: aktive().map(e => ({ beginn: e.beginn, ende: e.ende, typ: e.typ, quelle: e.quelle || 'manuell', orte: e.orte || undefined })), tage: DB.tage.map(t => ({ beginn: t.beginn, ende: t.ende, quelle: t.quelle || 'manuell' })), einstellungen: S() };
  DB.meta.letztesBackup = new Date().toISOString(); DB.meta.geaendert = 0; DB.meta.ersteAenderung = null; save(true);
  const name = `Zeiterfassung-Backup-${toDateInput(new Date())}.json`, blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' }), file = new File([blob], name, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) { try { await navigator.share({ files: [file], title: name, text: 'Zeiterfassung-Backup – im Teilen-Menü „Mail" wählen und an dich selbst schicken.' }); render(); return; } catch (e) { if (e.name === 'AbortError') { render(); return; } } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); render();
}
function backupImport(inp) {
  const f = inp.files && inp.files[0]; if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); let n = 0, t = 0, ue = 0;
    if ((DB.einsaetze.length || DB.tage.length) && confirm('Vorhandene Einträge vor dem Wiederherstellen löschen (vollständig durch das Backup ersetzen)?\n\nAbbrechen = zusammenführen (Dubletten werden übersprungen).')) { DB.einsaetze = []; DB.tage = []; }
    for (const x of d.tage || []) { if (RB.istDublette(new Date(x.beginn))) { ue++; continue; } DB.tage.push({ id: uid(), beginn: x.beginn, ende: x.ende, quelle: x.quelle || 'manuell' }); t++; }
    for (const x of d.einsaetze || []) { const b = new Date(x.beginn), e = new Date(x.ende); if (DB.einsaetze.some(y => Math.abs(B(y) - b) < 60000 && Math.abs(E(y) - e) < 60000)) { ue++; continue; } const rr = RB.einfuegen(b, e, x.typ === 'vorort' ? 'vorort' : 'technisch', x.quelle || 'manuell'); if (x.orte) rr.neu.orte = x.orte; if (rr.art === 'neu') n++; else ue++; }
    if (d.einstellungen && confirm('Auch die Einstellungen aus dem Backup übernehmen?')) DB.s = Object.assign(defaultSettings(), d.einstellungen);
    DB.meta.letztesBackup = new Date().toISOString(); DB.meta.geaendert = 0; DB.meta.ersteAenderung = null; save(true); sheetMeldung = `Wiederhergestellt: ${n} Einsätze, ${t} Tage${ue ? `, ${ue} Dubletten übersprungen` : ''}`; renderSheet(); } catch (e) { alert('Wiederherstellen fehlgeschlagen: ' + e); } };
  r.readAsText(f);
}

load();
$('zahnrad').onclick = () => sheet(true);
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) sheet(false); });
matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => render());
render();
setTimeout(backupHinweisPruefen, 1500);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
